[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_dir = "cache"
gas_reports = ["*"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

[profile.ci]
fuzz_runs = 10000
invariant_runs = 1000

# Etherscan API Configuration
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
polygon_amoy = { key = "${POLYGONSCAN_API_KEY}" }
polygon = { key = "${POLYGONSCAN_API_KEY}" }

# RPC Endpoints
[rpc_endpoints]
sepolia = "https://sepolia.infura.io/v3/${INFURA_API_KEY}"
polygon_amoy = "https://rpc-amoy.polygon.technology"
polygon = "https://polygon-rpc.com"
localhost = "http://127.0.0.1:8545"

# Code Formatting
[fmt]
line_length = 100
tab_width = 4
wrap_comments = true
